  <style>
    /* ==================================================================
       Plaid to the Bone
       ==================================================================
       The tartan is inline SVG, not an <img>, so the page can drive it.
       Everything moves in CSS; JavaScript only swaps a class and pauses
       the clock.

       Each weave is a class on the SVG:
         drift     the tartan slides on both axes
         flow      dashes march along every thread
         swell     stroke weight pulses while the cloth pans past
         undertow  every thread is a traffic lane with its own speed
         vertigo   each color turns on the center at its own rate

       Durations are prime-ish and unequal, so nothing lines up twice
       and the pattern never resolves.

       Dash travel is always a whole number of dash periods. Anything
       else lands the last frame on a different phase than the first
       and the loop hitches.
       ================================================================== */

    /* ── The tint ──────────────────────────────────────────────────────
       A hue rotation on the stage, so the ground turns with the threads
       and the tartan stays a tartan.

       At rest the value is none, so an untinted page pays for no filter
       pass. The first press interpolates against the identity, which is
       a rotation of nothing. After that the angle only climbs; sending
       it back to none or to 0 would transition backwards and unwind the
       whole turn. */

    .piece__stage--tartan {
      background: #182c4b;
      filter: var(--tint, none);
      transition: filter var(--duration-slow) var(--ease-out);
    }

    .weave {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: stretch;
    }

    /* Only the panning weave is oversized, so the travel never drags an
       edge into view. The rest fill the stage exactly. */

    .weave--pan {
      inset: -95% -24%;
      animation: pan 54s var(--ease-in-out) infinite;
    }

    .tartan {
      width: 100%;
      height: 100%;
      display: block;
    }

    .tartan__ground { fill: #182c4b; }

    .tartan__thread {
      fill: none;
      stroke-width: 10px;
      stroke-opacity: 1;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }

    .tartan .tartan__thread--teal  { stroke: #008f91; }
    .tartan .tartan__thread--red   { stroke: #ef3a47; }
    .tartan .tartan__thread--gold  { stroke: #fdb515; }
    .tartan .tartan__thread--blue  { stroke: #043673; }
    .tartan .tartan__thread--green { stroke: #009647; }

    /* ── drift ─────────────────────────────────────────────────────────
       Horizontal threads travel up and down, vertical threads left and
       right, each color on its own clock. */

    @keyframes drift-y {
      0%   { transform: translateY(20%); }
      45%  { transform: translateY(0); }
      55%  { transform: translateY(0); }
      100% { transform: translateY(-20%); }
    }

    @keyframes drift-x {
      0%   { transform: translateX(20%); }
      45%  { transform: translateX(0); }
      55%  { transform: translateX(0); }
      100% { transform: translateX(-20%); }
    }

    .tartan--drift .tartan__warp line {
      animation-name: drift-y;
      animation-timing-function: ease;
      animation-direction: alternate-reverse;
    }

    .tartan--drift .tartan__weft line {
      animation-name: drift-x;
      animation-timing-function: ease;
      animation-direction: alternate-reverse;
    }

    .tartan--drift .tartan__thread--teal  { animation-duration: 10s; }
    .tartan--drift .tartan__thread--red   { animation-duration: 20s; }
    .tartan--drift .tartan__thread--gold  { animation-duration: 8s;  }
    .tartan--drift .tartan__thread--blue  { animation-duration: 15s; }
    .tartan--drift .tartan__thread--green { animation-duration: 17s; }

    /* ── flow ──────────────────────────────────────────────────────────
       Every thread becomes a dashed line and the dashes run, horizontal
       one way and vertical the other.

       The dash pattern sums to 244, so the offset travels 488, two whole
       patterns. Anything short of a whole period puts the last frame out
       of phase with the first and the loop hitches. */

    @keyframes flow-down {
      from { stroke-dashoffset: 0;    }
      to   { stroke-dashoffset: -488; }
    }

    @keyframes flow-up {
      from { stroke-dashoffset: 0;   }
      to   { stroke-dashoffset: 488; }
    }

    .tartan--flow line {
      stroke-dasharray: 130 34 46 34;
      stroke-linecap: butt;
      animation-timing-function: linear;
    }

    .tartan--flow .tartan__warp line { animation-name: flow-down; }
    .tartan--flow .tartan__weft line { animation-name: flow-up;   }

    .tartan--flow .tartan__thread--teal  { animation-duration: 3.1s; }
    .tartan--flow .tartan__thread--red   { animation-duration: 4.7s; }
    .tartan--flow .tartan__thread--gold  { animation-duration: 2.3s; }
    .tartan--flow .tartan__thread--blue  { animation-duration: 6.1s; }
    .tartan--flow .tartan__thread--green { animation-duration: 3.7s; }

    /* ── swell ─────────────────────────────────────────────────────────
       Stroke weight and opacity rise together. Warp and weft run on
       separate sets of durations, so the two axes drift apart and the
       crossings light in turn rather than the whole field flashing at
       once. The negative delays start each color mid-wave, which sends
       the swell across the cloth at an angle. */

    @keyframes swell {
      0%, 100% { stroke-width: 7px;  stroke-opacity: .55; }
      50%      { stroke-width: 30px; stroke-opacity: 1;   }
    }

    .tartan--swell line {
      animation-name: swell;
      animation-timing-function: var(--ease-in-out);
    }

    .tartan--swell .tartan__warp .tartan__thread--teal  { animation-duration: 4.3s; animation-delay: -0.0s; }
    .tartan--swell .tartan__warp .tartan__thread--red   { animation-duration: 5.9s; animation-delay: -1.1s; }
    .tartan--swell .tartan__warp .tartan__thread--gold  { animation-duration: 3.1s; animation-delay: -2.2s; }
    .tartan--swell .tartan__warp .tartan__thread--blue  { animation-duration: 7.3s; animation-delay: -0.7s; }
    .tartan--swell .tartan__warp .tartan__thread--green { animation-duration: 4.9s; animation-delay: -3.4s; }

    .tartan--swell .tartan__weft .tartan__thread--teal  { animation-duration: 9.7s; animation-delay: -2.6s; }
    .tartan--swell .tartan__weft .tartan__thread--red   { animation-duration: 3.7s; animation-delay: -0.4s; }
    .tartan--swell .tartan__weft .tartan__thread--gold  { animation-duration: 6.7s; animation-delay: -3.9s; }
    .tartan--swell .tartan__weft .tartan__thread--blue  { animation-duration: 2.9s; animation-delay: -1.8s; }
    .tartan--swell .tartan__weft .tartan__thread--green { animation-duration: 8.3s; animation-delay: -5.1s; }

    /* ── the pan ───────────────────────────────────────────────────────
       The tartan is cropped to the stage, so a still frame shows only
       the middle of the cloth. Under the swell the whole weave tours
       past the screen.

       The wrapper is oversized by exactly the travel on each side, both
       figures percentages of the same box, so the margin holds at every
       screen shape. The SVG covers on the long edge, so growing the
       wrapper downward costs no scale and buys the vertical reach. */

    @keyframes pan {
      0%   { transform: translate(-15%, -28%); }
      25%  { transform: translate( -4%,  26%); }
      50%  { transform: translate( 15%, -12%); }
      75%  { transform: translate(  3%,  28%); }
      100% { transform: translate(-15%, -28%); }
    }

    /* ── undertow ──────────────────────────────────────────────────────
       Every thread is a lane of traffic: seven lanes repeat across the
       cloth, each with its own dash length, gap, speed, and heading,
       with the swell still running underneath.

       Lane and swell each need a duration in the same list, and one is
       set by position while the other is set by color. Custom
       properties keep them apart: the lane rules own the lane
       variables, the color rules own the swell ones, and the shorthand
       below reads both.

       Every travel is a whole number of dash periods, so no lane
       hitches when it loops. */

    @keyframes lane-run {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: var(--travel); }
    }

    .tartan--undertow line {
      stroke-linecap: butt;
      stroke-dasharray: var(--dash);
      animation-name: lane-run, swell;
      animation-duration: var(--lane-dur), var(--swell-dur);
      animation-timing-function: linear, var(--ease-in-out);
      animation-delay: var(--lane-delay), var(--swell-delay);
    }

    /* The lanes. nth-child counts inside each group, so the same seven
       rules dress the warp and the weft. */

    .tartan--undertow line:nth-child(7n+1) { --dash: 160 110; --lane-travel: -1080px; --lane-dur: 6.5s;  --lane-delay: -0.0s; }
    .tartan--undertow line:nth-child(7n+2) { --dash: 70 380;  --lane-travel:  1350px; --lane-dur: 5.1s;  --lane-delay: -1.3s; }
    .tartan--undertow line:nth-child(7n+3) { --dash: 300 60;  --lane-travel: -1440px; --lane-dur: 9.7s;  --lane-delay: -2.7s; }
    .tartan--undertow line:nth-child(7n+4) { --dash: 110 220; --lane-travel:  1320px; --lane-dur: 4.1s;  --lane-delay: -0.9s; }
    .tartan--undertow line:nth-child(7n+5) { --dash: 410 160; --lane-travel: -1710px; --lane-dur: 12.3s; --lane-delay: -3.8s; }
    .tartan--undertow line:nth-child(7n+6) { --dash: 55 60;   --lane-travel: -1150px; --lane-dur: 3.3s;  --lane-delay: -1.6s; }
    .tartan--undertow line:nth-child(7n+7) { --dash: 215 465; --lane-travel:  1360px; --lane-dur: 7.9s;  --lane-delay: -2.1s; }

    /* Traffic runs one way across the warp and the other way down the
       weft, so the two streams meet head on at every crossing. */

    .tartan--undertow .tartan__warp line { --travel: var(--lane-travel); }
    .tartan--undertow .tartan__weft line { --travel: calc(-1 * var(--lane-travel)); }

    .tartan--undertow .tartan__thread--teal  { --swell-dur: 4.3s; --swell-delay: -0.0s; }
    .tartan--undertow .tartan__thread--red   { --swell-dur: 5.9s; --swell-delay: -1.1s; }
    .tartan--undertow .tartan__thread--gold  { --swell-dur: 3.1s; --swell-delay: -2.2s; }
    .tartan--undertow .tartan__thread--blue  { --swell-dur: 7.3s; --swell-delay: -0.7s; }
    .tartan--undertow .tartan__thread--green { --swell-dur: 4.9s; --swell-delay: -3.4s; }

    /* ── vertigo ───────────────────────────────────────────────────────
       Every color turns on the middle of the cloth at its own rate, warp
       against weft, so the moiré never repeats.

       The origin is the center of the viewBox. The scale holds at 1.7
       the whole way: a square of lines turned forty five degrees leaves
       the corners of the screen bare unless it is bigger than the
       screen's diagonal. */

    @keyframes spin {
      from { transform: rotate(0turn) scale(1.7); }
      to   { transform: rotate(1turn) scale(1.7); }
    }

    .tartan--vertigo line {
      stroke-width: 7px;
      transform-box: view-box;
      transform-origin: 1237.5px 1237.5px;
      animation-name: spin;
      animation-duration: var(--spin-dur);
      animation-timing-function: linear;
    }

    .tartan--vertigo .tartan__weft line { animation-direction: reverse; }

    .tartan--vertigo .tartan__thread--teal  { --spin-dur: 41s; }
    .tartan--vertigo .tartan__thread--red   { --spin-dur: 67s; }
    .tartan--vertigo .tartan__thread--gold  { --spin-dur: 29s; }
    .tartan--vertigo .tartan__thread--blue  { --spin-dur: 89s; }
    .tartan--vertigo .tartan__thread--green { --spin-dur: 53s; }

    /* ── the pause ─────────────────────────────────────────────────────
       One class on the stage stops every clock at once, wrapper and
       threads together, and leaves the picture where it stood. */

    .is-paused .weave,
    .is-paused .tartan line {
      animation-play-state: paused;
    }

    /* ── the still version ─────────────────────────────────────────────
       site.css already collapses the durations. This keeps the dashes
       and the thin strokes from freezing mid-stride and leaving the
       cloth full of holes. */

    @media (prefers-reduced-motion: reduce) {
      .tartan line {
        stroke-dasharray: none !important;
        stroke-width: 10px !important;
        stroke-opacity: 1 !important;
        /* With the duration collapsed, the fill mode carries the last
           keyframe and would park the tartan 20% off its own edge. */
        transform: none !important;
      }
      .weave { inset: 0 !important; transform: none !important; }
    }
  </style>

  <script>
    (function () {
      // Every weave is a class on the SVG plus a flag for the wrapper
      // pan. The first one is the tartan standing still.
      var weaves = [
        { name: 'Vector Tartan', cls: 'tartan--drift',    pan: false },
        { name: 'River',         cls: 'tartan--flow',     pan: false },
        { name: 'Swell',         cls: 'tartan--swell',    pan: true  },
        { name: 'Undertow',      cls: 'tartan--undertow', pan: false },
        { name: 'Vertigo',       cls: 'tartan--vertigo',  pan: false }
      ];

      var tartan   = document.getElementById('tartan');
      var weaveEl  = document.getElementById('weave');
      var stage    = document.getElementById('stage');
      var nameEl   = document.getElementById('weave-name');
      var playBtn  = document.getElementById('play-btn');
      var weaveBtn = document.getElementById('weave-btn');
      var hueBtn   = document.getElementById('hue-btn');
      var hueOut   = document.getElementById('hue-readout');

      var current = 0;
      var playing = false;

      function applyWeave(i) {
        var w = weaves[i];
        weaves.forEach(function (o) { tartan.classList.remove(o.cls); });
        tartan.classList.add(w.cls);
        weaveEl.classList.toggle('weave--pan', w.pan);
        nameEl.textContent = w.name;
        current = i;
      }

      function nextWeave() {
        applyWeave((current + 1) % weaves.length);
      }

      // A fifth of the wheel a press, wrapping back to the tartan's own
      // colors. The readout wraps; the angle never does. It only adds
      // 72, so the fifth press lands on 360 and a whole turn is the same
      // picture as no turn, with nothing to undo at the end.
      var HUE_STEP = 20;
      var hue      = 0;
      var hueDeg   = 0;

      function nextHue() {
        hue     = (hue + HUE_STEP) % 100;
        hueDeg += HUE_STEP * 3.6;
        document.body.style.setProperty('--tint', 'hue-rotate(' + hueDeg + 'deg)');
        hueOut.textContent = hue + '%';
      }

      function setPlaying(on) {
        playing = on;
        stage.classList.toggle('is-paused', !on);
        Piece.setPlay(playBtn, on);
      }

      playBtn.addEventListener('click', function () { setPlaying(!playing); });

      weaveBtn.addEventListener('click', function () {
        nextWeave();
        Piece.turn(weaveBtn);
        // A weave change with the clock stopped would look broken.
        if (!playing) setPlaying(true);
      });

      hueBtn.addEventListener('click', function () {
        nextHue();
        Piece.turn(hueBtn);
      });

      setPlaying(false);
    }());
  </script>

  <script src="../js/jump.js" defer></script>

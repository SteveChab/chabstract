<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>LarvaScript: trippy, glitchy, nauseating, abstract art animations - Steve Chab</title>
  <meta name="description" content="Trippy, glitchy, nauseating, computer art animations">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="author" content="Steve Chab">
  <meta name="msapplication-TileImage" content="../tile.png">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="../favicon.svg">
  <link rel="apple-touch-icon" href="../icon.png">

  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css?v=20250915">

  <style>
    html, .page-container {
      overflow: hidden;
      height: 100%;
      width: 100%;
      position: relative;
      background-color: var(--color-dark);
    }

    /* ── Existing: Spiral ───────────────────────────────────────────────────── */

    .art-container {
      height: 100vh;
      width: 100vw;
      transform: rotate(45deg) scale(2);
      position: absolute;
      z-index: 0;
    }

    .art {
      background: url(https://live.staticflickr.com/65535/54138947577_1384540199_b.jpg);
      background-repeat: repeat;
      background-position-x: 0;
      background-position-y: center;
      display: block;
      position: absolute;
      left: -50vw;
      top: -50vh;
      height: 100vh;
      width: 100vw;
    }

    .art--2 { transform: rotate(90deg);  transform-origin: bottom right; }
    .art--3 { transform: rotate(180deg); transform-origin: bottom right; }
    .art--4 { transform: rotate(270deg); transform-origin: bottom right; }

    /* ── Mode system ────────────────────────────────────────────────────────── */

    .mode-container {
      display: none;
      position: absolute;
      inset: 0;
    }
    .mode-container.active { display: block; }
    #mode-circles { overflow: hidden; }

    /* ── Stripes: Rush Hour ─────────────────────────────────────────────────── */

    .stripe {
      position: absolute;
      left: 0;
      width: 100%;
      background-repeat: repeat-x;
      background-size: cover;
      animation-name: stripe-scroll;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-play-state: paused;
    }

    @keyframes stripe-scroll {
      from { background-position-x: 0      }
      to   { background-position-x: -100vw }
    }

    /* ── Squares: Rubik's Fever ─────────────────────────────────────────────── */

    .squares-grid {
      display: grid;
      width: 100%;
      height: 100%;
    }

    .square-cell {
      overflow: hidden;
      animation-name: square-skew;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-play-state: paused;
    }

    @keyframes square-skew {
      0%,  100% { transform: skew(  0deg,  0deg) }
      25%        { transform: skew(  8deg, -4deg) }
      50%        { transform: skew( -6deg,  6deg) }
      75%        { transform: skew(  4deg, -8deg) }
    }

    /* ── Circles: Carnival Eyes ─────────────────────────────────────────────── */

    .circle-orb {
      position: absolute;
      border-radius: 50%;
      overflow: hidden;
      background-repeat: no-repeat;
      background-size: cover;         /* always fills the circle */
      animation-name: circle-wobble;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-play-state: paused;
    }

    @keyframes circle-wobble {
      0%,  100% { transform: rotate(var(--orb-rot, 0deg)) translate(   0,    0) scale(1)     }
      25%        { transform: rotate(var(--orb-rot, 0deg)) translate( 4px,  -5px) scale(1.02)  }
      50%        { transform: rotate(var(--orb-rot, 0deg)) translate(-5px,   3px) scale(0.98)  }
      75%        { transform: rotate(var(--orb-rot, 0deg)) translate( 3px,   5px) scale(1.015) }
    }

    /* ── Mode switcher ──────────────────────────────────────────────────────── */

    .mode-nav {
      position: absolute;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 0.25rem;
      white-space: nowrap;
    }

    /*
     * Glyph buttons: square-ish, sized so the unicode character reads clearly.
     * No override of the inherited [aria-pressed="true"] rotate — that comes
     * from main.css and stays as-is per the project's existing pattern.
     */
    .mode-btn {
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.35rem 0.55rem;
      min-width: 2.2rem;
      text-align: center;
    }

    /* ── Existing: other UI ─────────────────────────────────────────────────── */

    .action-button { z-index: 100; }

    .url-input {
      position: absolute;
      background: white;
      padding: 1rem;
      bottom: 1rem;
      left: calc(var(--icon-height) + var(--container-padding));
      border: none;
      height: var(--icon-height);
      width: 50vw;
      z-index: 5;
      font-family: var(--font-stack);
      font-size: 1rem;
    }

    .control-container {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      line-height: 0;
      z-index: 5;
    }

    .control {
      background: white 0 0 scroll repeat;
      text-indent: -9999px;
      line-height: 0;
    }

    @media (max-width: 767px) {
      .control { display: block; margin: .5em 0 0 0; }
    }

    [aria-pressed="true"] { transform: rotate(45deg); }

    .overlay {
      background: url(images/bg.gif) center center scroll repeat transparent;
      position: absolute;
      z-index: 1;
      top: 0; right: 0; bottom: 0; left: 0;
      mix-blend-mode: overlay;
      opacity: .65;
    }
  </style>
</head>

<body class="page-container">

    <span class="sr-only">Steve Chab Homepage</span>
    <svg aria-hidden="true" class="header__link-home__wordmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 337.3 49.9">

  <h1 class="sr-only">LarvaScript: your retinas asked for this</h1>

  <!-- ── Mode containers ────────────────────────────────────────────────────── -->

  <div id="mode-spiral" class="mode-container active" aria-hidden="true">
    <main class="art-container">
      <div class="art art--1"></div>
      <div class="art art--2"></div>
      <div class="art art--3"></div>
      <div class="art art--4"></div>
    </main>
  </div>

  <div id="mode-stripes" class="mode-container" aria-hidden="true"></div>
  <div id="mode-squares" class="mode-container" aria-hidden="true"></div>
  <div id="mode-circles" class="mode-container" aria-hidden="true"></div>

  <!-- ── Existing controls ──────────────────────────────────────────────────── -->

  <button class="icon action-button" aria-pressed="false">
    <span class="sr-only">Play Animation</span>
  </button>

  <input
    class="url-input"
    type="url"
    value=""
    placeholder="Paste an image URL to use as the art source"
    aria-label="Paste an image URL to use as the art source"
  >

  <div class="control-container">
    <button class="icon control" aria-pressed="true"  data-art="images/bg.gif">Crosshatch Filter</button>
    <button class="icon control" aria-pressed="false" data-art="images/bg-moving-black.gif">Crawling Diagonals</button>
    <button class="icon control" aria-pressed="false" data-art="images/bg-noise.gif">Animated Noise</button>
    <button class="icon control" aria-pressed="false" data-art="images/bg-t.gif">RGB Strobe</button>
    <button class="icon control" aria-pressed="false" data-art="images/bg-strobe.gif">Black and White Strobe</button>
  </div>

  <div class="overlay"></div>

  <!-- ── Mode switcher ──────────────────────────────────────────────────────── -->
  <!--
    Glyphs chosen from the Unicode geometric / symbol blocks:
      ꩜  U+AA5C  Cham Punctuation Spiral     → The Wormhole
      ☰  U+2630  Trigram for Heaven           → Rush Hour   (3 horizontal bars)
      ▦  U+25A6  Sq. with Orthogonal Xhatch  → Rubik's Fever (grid-in-square)
      ◎  U+25CE  Bullseye                     → Carnival Eyes (concentric rings)
  -->
  <nav class="mode-nav" aria-label="Choose your affliction">
    <button class="mode-btn" data-mode="spiral"  aria-pressed="true"  aria-label="The Wormhole">꩜</button>
    <button class="mode-btn" data-mode="stripes" aria-pressed="false" aria-label="Rush Hour">☰</button>
    <button class="mode-btn" data-mode="squares" aria-pressed="false" aria-label="Rubik's Fever">▦</button>
    <button class="mode-btn" data-mode="circles" aria-pressed="false" aria-label="Carnival Eyes">◎</button>
  </nav>

  <script>
    document.addEventListener('DOMContentLoaded', function () {

      var DEFAULT_IMAGE   = 'https://live.staticflickr.com/65535/54138947577_1384540199_b.jpg';
      var currentImageUrl = DEFAULT_IMAGE;
      var currentMode     = 'spiral';
      var isPlaying       = false;
      var spiralInterval  = null;
      var spiralDegrees   = 45.0;
      var spiralBgOffset  = 0;

      var overlay      = document.querySelector('.overlay');
      var artContainer = document.querySelector('.art-container');
      var artPanels    = document.querySelectorAll('.art');
      var actionButton = document.querySelector('.action-button');
      var urlInput     = document.querySelector('.url-input');
      var controls     = document.querySelectorAll('.control');
      var modeButtons  = document.querySelectorAll('.mode-btn');

      var modes = {
        spiral:  document.getElementById('mode-spiral'),
        stripes: document.getElementById('mode-stripes'),
        squares: document.getElementById('mode-squares'),
        circles: document.getElementById('mode-circles'),
      };

      // ── Image management ─────────────────────────────────────────────────────

      function setImageUrl(url) {
        currentImageUrl = url || DEFAULT_IMAGE;
        var imgVal = url ? 'url(' + url + ')' : '';
        artPanels.forEach(function (p) { p.style.backgroundImage = imgVal; });
        document.querySelectorAll('.stripe, .square-cell, .circle-orb').forEach(function (el) {
          el.style.backgroundImage = 'url(' + currentImageUrl + ')';
        });
      }

      urlInput.addEventListener('input', function () { setImageUrl(urlInput.value); });

      // ── Overlay filter buttons ───────────────────────────────────────────────

      controls.forEach(function (btn) {
        btn.style.backgroundImage = 'url(' + btn.dataset.art + ')';
        btn.addEventListener('click', function () {
          controls.forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
          btn.setAttribute('aria-pressed', 'true');
          overlay.style.backgroundImage = 'url(' + btn.dataset.art + ')';
        });
      });

      // ── Play / pause ─────────────────────────────────────────────────────────

      function applyPlayState() {
        actionButton.setAttribute('aria-pressed', isPlaying ? 'true' : 'false');

        if (currentMode === 'spiral') {
          if (isPlaying) {
            if (!spiralInterval) spiralInterval = setInterval(spiralTick, 40);
          } else {
            clearInterval(spiralInterval);
            spiralInterval = null;
          }
        } else {
          var state = isPlaying ? 'running' : 'paused';
          modes[currentMode].querySelectorAll('.stripe, .square-cell, .circle-orb').forEach(function (el) {
            el.style.animationPlayState = state;
          });
        }
      }

      actionButton.addEventListener('click', function () {
        isPlaying = !isPlaying;
        applyPlayState();
      });

      // ── Mode: Spiral ─────────────────────────────────────────────────────────

      function spiralTick() {
        spiralDegrees++;
        spiralBgOffset++;
        artContainer.style.transform = 'rotate(' + spiralDegrees + 'deg) scale(2)';
        artPanels.forEach(function (p) {
          p.style.backgroundPosition = spiralBgOffset + 'px center';
        });
      }

      // ── Mode: Stripes (Rush Hour) ─────────────────────────────────────────────

      function buildStripes() {
        var container = modes.stripes;
        if (container.children.length) return;

        var N = 16;
        var speeds = [7, 11, 6, 18, 9, 14, 8, 22, 12, 7, 20, 10, 15, 8, 13, 16];

        for (var i = 0; i < N; i++) {
          var strip = document.createElement('div');
          strip.className                  = 'stripe';
          strip.style.top                  = (i / N * 100) + '%';
          strip.style.height               = (100 / N) + '%';
          strip.style.backgroundImage      = 'url(' + currentImageUrl + ')';
          strip.style.backgroundPositionY  = (i / (N - 1) * 100) + '%';
          strip.style.animationDuration    = speeds[i] + 's';
          strip.style.animationDirection   = i % 2 === 0 ? 'normal' : 'reverse';
          strip.style.animationPlayState   = 'paused';
          container.appendChild(strip);
        }
      }

      // ── Mode: Squares (Rubik's Fever) ─────────────────────────────────────────
      //
      // 7×7 grid of square cells. Each cell gets its own random zoom (150–350%)
      // and random crop, so the mosaic reads as remixed fragments rather than
      // one image. Durations 3–8s for a frantic, skittering feel.

      function buildSquares() {
        var container = modes.squares;
        if (container.children.length) return;

        var N = 7; // 7 cols × 7 rows = 49 cells
        var grid = document.createElement('div');
        grid.className                 = 'squares-grid';
        grid.style.gridTemplateColumns = 'repeat(' + N + ', 1fr)';
        grid.style.gridTemplateRows    = 'repeat(' + N + ', 1fr)';

        for (var i = 0; i < N * N; i++) {
          var cell = document.createElement('div');
          cell.className                = 'square-cell';
          cell.style.backgroundImage    = 'url(' + currentImageUrl + ')';
          var zoom = (150 + Math.random() * 200).toFixed(0);
          cell.style.backgroundSize     = zoom + '%';
          cell.style.backgroundPosition = (Math.random() * 100).toFixed(1) + '% ' +
                                          (Math.random() * 100).toFixed(1) + '%';
          cell.style.animationDuration  = (3 + Math.random() * 5).toFixed(1) + 's';
          cell.style.animationDelay     = (-1 * Math.random() * 8).toFixed(2) + 's';
          cell.style.animationPlayState = 'paused';
          grid.appendChild(cell);
        }

        container.appendChild(grid);
      }

      // ── Mode: Circles (Carnival Eyes) ─────────────────────────────────────────
      //
      // 40 orbs, fully randomly placed each page load. background-size: cover
      // (set in CSS) ensures the image always fills the circle. Each orb gets
      // a random --orb-rot baked into every keyframe step, plus a random
      // background-position so each circle shows a different crop.

      function buildCircles() {
        var container = modes.circles;
        if (container.children.length) return;

        var COUNT = 40;

        for (var i = 0; i < COUNT; i++) {
          // Random size: mix of large statement orbs and small filler orbs
          var size = Math.round(50 + Math.random() * 350);
          // Random centre position — allow orbs to hang off edges intentionally
          var x = -10 + Math.random() * 120;  // -10% to 110%
          var y = -10 + Math.random() * 120;
          var rot = Math.round(Math.random() * 360);

          var orb = document.createElement('div');
          orb.className = 'circle-orb';
          orb.style.setProperty('--orb-rot', rot + 'deg');
          orb.style.width               = size + 'px';
          orb.style.height              = size + 'px';
          orb.style.left                = 'calc(' + x + '% - ' + (size / 2) + 'px)';
          orb.style.top                 = 'calc(' + y + '% - ' + (size / 2) + 'px)';
          orb.style.backgroundImage     = 'url(' + currentImageUrl + ')';
          orb.style.backgroundPosition  = (Math.random() * 100).toFixed(1) + '% ' +
                                          (Math.random() * 100).toFixed(1) + '%';
          orb.style.animationDuration   = (2 + Math.random() * 4).toFixed(2) + 's';
          orb.style.animationDelay      = (-1 * Math.random() * 6).toFixed(2) + 's';
          orb.style.animationPlayState  = 'paused';
          container.appendChild(orb);
        }
      }

      // ── Mode switching ───────────────────────────────────────────────────────

      var modeBuilders = { stripes: buildStripes, squares: buildSquares, circles: buildCircles };

      function switchMode(name) {
        clearInterval(spiralInterval);
        spiralInterval = null;

        Object.keys(modes).forEach(function (key) {
          modes[key].classList.toggle('active', key === name);
          modes[key].setAttribute('aria-hidden', key !== name ? 'true' : 'false');
        });

        modeButtons.forEach(function (btn) {
          btn.setAttribute('aria-pressed', btn.dataset.mode === name ? 'true' : 'false');
        });

        currentMode = name;

        if (modeBuilders[name]) modeBuilders[name]();
        applyPlayState();
      }

      modeButtons.forEach(function (btn) {
        btn.addEventListener('click', function () { switchMode(btn.dataset.mode); });
      });

    });
  </script>
</body>

</html>

    /* ── The entry ────────────────────────────────────────────────────
       Two layers. The ghost is the same term set huge and almost
       invisible, and it runs the height of the frame rather than the
       stage, so a word taller than the stage reads whole instead of
       stopping at the nav. The entry is the readable layer in front. */

    /* The ghost is a child of the frame, so the frame is its containing
       block. */

    .piece { position: relative; }

    /* The head, stage, and bar drop var(--surface), which is the body
       color anyway, so the ghost can run behind them. */

    .piece__head,
    .piece__stage,
    .bar { background: transparent; }

    .entry {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 8vh 5vw 8vh 9vw;
      display: grid;
      align-content: center;
      overflow: hidden;
      z-index: 1;

    .entry__term {

    }

    .entry__definition {
      margin: 3vh 0 0 3vw;
      font-family: var(--font-slab);
      font-weight: 300;
      font-size: clamp(1.1rem, 4vw, 3.2rem);
      line-height: 1.15;
    }

    /* Full height of the frame, under everything. Grid holds the term
       low and right, so a long one grows upward behind the nav and the
       transform stays free for the slide-in keyframe. */

    .ghost {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: grid;
      align-content: end;
      justify-items: end;
      padding-bottom: 8%;
      overflow: hidden;
      pointer-events: none;
    }

    .ghost__term {
      margin-right: -2vw;
      max-width: none;
      font-family: var(--font-slab);
      font-weight: 700;
      font-size: 25vw;
      line-height: 1;
      letter-spacing: -.025em;
      text-align: right;
      opacity: .05;
    }

    @keyframes entry-in {
      from { opacity: 0; transform: translateY(.6rem); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes ghost-in {
      0%, 10% { opacity: 0; transform: translateX(-35vw); }
      100%    { opacity: .05; transform: translateX(0); }
    }

    /* Stripped and re-added on every press, so each run is a fresh one.
       It rides on the frame rather than the stage, because the ghost
       hangs off the frame. */

    .is-fresh .entry { animation: entry-in var(--duration-slow) var(--ease-out) 1; }
    .is-fresh .ghost__term { animation: ghost-in calc(var(--duration-slow) * 2) var(--ease-out) 1; }

       the raw data. */
    .no-js-note {
      position: relative;
      z-index: 2;
      padding: var(--space-8) 0;
      font-size: 1.05rem;
